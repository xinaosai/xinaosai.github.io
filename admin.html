<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚙️ 管理后台 - 信奥赛C++</title>
<script src="https://assets/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
nav{background:#161b22;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30363d}
nav a{color:#58a6ff;text-decoration:none}
.container{max-width:800px;margin:0 auto;padding:32px 20px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;margin-bottom:20px}
h2{color:#f0f6fc;margin-bottom:4px}
h3{color:#f0f6fc;margin-bottom:12px}

.search-bar{width:100%;padding:10px 16px;background:#0d1117;border:2px solid #30363d;color:#c9d1d9;border-radius:8px;font-size:1rem;margin-bottom:16px}
.search-bar:focus{outline:none;border-color:#58a6ff}

.user-list{max-height:400px;overflow-y:auto}
.user-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #30363d;gap:12px;flex-wrap:wrap}
.user-row:hover{background:rgba(88,166,255,.05)}
.user-info{min-width:200px}
.user-email{font-weight:600;color:#f0f6fc}
.user-credits{font-size:.85rem;color:#8b949e}
.credit-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{padding:8px 18px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.85rem;transition:.2s;white-space:nowrap}
.btn-add{background:#238636;color:#fff}.btn-add:hover{background:#2ea043}
.btn-custom{background:#1f6feb;color:#fff}.btn-custom:hover{background:#388bfd}
.btn-reset{background:#da3633;color:#fff}.btn-reset:hover{background:#f85149}
.btn-outline{background:transparent;border:1px solid #30363d;color:#c9d1d9}
input[type=number]{width:70px;padding:8px 10px;background:#0d1117;border:2px solid #30363d;color:#c9d1d9;border-radius:6px;text-align:center;font-size:.9rem}
input[type=number]:focus{outline:none;border-color:#58a6ff}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-weight:600;z-index:9999;animation:slideIn .3s ease;display:none}
.toast.success{background:#238636}.toast.error{background:#da3633}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
.login-card{max-width:380px;margin:80px auto;text-align:center}
.login-card input{width:100%;padding:12px;background:#0d1117;border:2px solid #30363d;color:#c9d1d9;border-radius:8px;font-size:1rem;margin-bottom:12px}
.login-card input:focus{outline:none;border-color:#58a6ff}
.logout-btn{color:#f85149;cursor:pointer;font-size:.85rem;border:none;background:none}
.stats{display:flex;gap:20px;flex-wrap:wrap}
.stat{flex:1;min-width:140px;background:#0d1117;padding:16px;border-radius:8px;text-align:center}
.stat .num{font-size:1.8rem;font-weight:700;color:#58a6ff}
.stat .label{font-size:.8rem;color:#8b949e;margin-top:4px}
</style>
</head>
<body>

<nav>
  <span style="color:#f0f6fc;font-weight:700">⚙️ 管理后台</span>
  <div style="display:flex;gap:12px;align-items:center">
    <span id="adminEmail" style="color:#8b949e;font-size:.85rem"></span>
    <button class="logout-btn" onclick="handleLogout()">退出</button>
  </div>
</nav>

<div class="container" id="loginSection">
  <div class="card login-card">
    <h2>🔐 管理员登录</h2>
    <p style="color:#8b949e;margin:8px 0 20px">仅限管理员账号登录</p>
    <input type="email" id="loginEmail" placeholder="管理员邮箱">
    <input type="password" id="loginPassword" placeholder="密码">
    <button class="btn btn-add" style="width:100%;padding:14px;font-size:1rem" onclick="handleLogin()">登录</button>
  </div>
</div>

<div class="container hidden" id="adminSection">
  <!-- Stats -->
  <div class="card">
    <h3>📊 概览</h3>
    <div class="stats">
      <div class="stat"><div class="num" id="statUsers">-</div><div class="label">注册用户</div></div>
      <div class="stat"><div class="num" id="statTotalCredits">-</div><div class="label">剩余总次数</div></div>
      <div class="stat"><div class="num" id="statTodayUsed">-</div><div class="label">今日使用</div></div>
    </div>
  </div>

  <!-- User List -->
  <div class="card">
    <h3>👥 用户管理</h3>
    <input class="search-bar" id="searchInput" placeholder="🔍 搜索用户邮箱..." oninput="renderUsers()">
    <div class="user-list" id="userList">
      <p style="text-align:center;color:#8b949e;padding:20px">加载中...</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://ikomfsvwkilqwlrlvvto.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SbwyOuBjz6v1dePb8h2cFw_gHeFtnNn';
const ADMIN_EMAIL = 'zhaomingyu0605@gmail.com';

let supabase, allUsers = [];

try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){}

function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type}`;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

async function handleLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) return showToast('请填写完整', 'error');
  
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) return showToast(error.message, 'error');
  
  if (data.user.email !== ADMIN_EMAIL) {
    await supabase.auth.signOut();
    return showToast('非管理员账号，拒绝访问', 'error');
  }
  showToast('登录成功');
  loadAdmin();
}

async function handleLogout() {
  await supabase.auth.signOut();
  document.getElementById('loginSection').classList.remove('hidden');
  document.getElementById('adminSection').classList.add('hidden');
}

async function addCredits(userId, amount) {
  if (amount <= 0) return;
  
  // Get current credits
  const { data: row } = await supabase.from('credits').select('credits').eq('user_id', userId).single();
  const curr = row?.credits ?? 0;
  const newCredits = curr + amount;
  
  await supabase.from('credits').upsert({ user_id: userId, credits: newCredits }, { onConflict: 'user_id' });
  await supabase.from('credit_logs').insert({
    user_id: userId, action: '💰 赞赏充值', amount: amount, balance: newCredits
  });
  
  showToast(`已添加 ${amount} 次`);
  loadAdmin();
}

async function setCredits(userId, amount) {
  if (amount < 0) return;
  const { data: row } = await supabase.from('credits').select('credits').eq('user_id', userId).single();
  const curr = row?.credits ?? 0;
  await supabase.from('credits').upsert({ user_id: userId, credits: amount }, { onConflict: 'user_id' });
  await supabase.from('credit_logs').insert({
    user_id: userId, action: '⚙️ 管理员调整', amount: amount - curr, balance: amount
  });
  showToast(`已设置为 ${amount} 次`);
  loadAdmin();
}

async function resetCredits(userId) {
  if (!confirm('确定清零此用户的额度？')) return;
  const { data: row } = await supabase.from('credits').select('credits').eq('user_id', userId).single();
  const curr = row?.credits ?? 0;
  await supabase.from('credits').upsert({ user_id: userId, credits: 0 }, { onConflict: 'user_id' });
  await supabase.from('credit_logs').insert({
    user_id: userId, action: '🔄 额度清零', amount: -curr, balance: 0
  });
  showToast('已清零');
  loadAdmin();
}

async function renderUsers() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allUsers.filter(u => u.email.toLowerCase().includes(query));
  
  const list = document.getElementById('userList');
  list.innerHTML = filtered.map(u => `
    <div class="user-row">
      <div class="user-info">
        <div class="user-email">${u.email}</div>
        <div class="user-credits">剩余 <strong style="color:${u.credits>0?'#2ea043':'#f85149'}">${u.credits}</strong> 次 | 注册: ${new Date(u.created_at).toLocaleDateString('zh-CN')}</div>
      </div>
      <div class="credit-actions">
        <button class="btn btn-add" onclick="addCredits('${u.user_id}',1)">+1</button>
        <button class="btn btn-add" onclick="addCredits('${u.user_id}',6)">+6</button>
        <button class="btn btn-add" onclick="addCredits('${u.user_id}',20)">+20</button>
        <input type="number" id="custom_${u.user_id}" value="10" min="1" style="width:55px">
        <button class="btn btn-custom" onclick="addCredits('${u.user_id}',+document.getElementById('custom_${u.user_id}').value)">充</button>
        <button class="btn btn-outline" onclick="setCredits('${u.user_id}',+prompt('设置额度为：'))">设</button>
        <button class="btn btn-reset" onclick="resetCredits('${u.user_id}')">清</button>
      </div>
    </div>
  `).join('');
}

async function loadAdmin() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user || user.email !== ADMIN_EMAIL) {
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('adminSection').classList.add('hidden');
    return;
  }
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('adminSection').classList.remove('hidden');
  document.getElementById('adminEmail').textContent = user.email;
  
  // Load all users
  const { data: credits } = await supabase.from('credits').select('*');
  // Get user emails from auth admin (limited in client SDK)
  // We'll use credit_logs to infer users
  const { data: logs } = await supabase.from('credit_logs').select('user_id,created_at').order('created_at',{ascending:false});
  const { data: allCredits } = await supabase.from('credits').select('*');
  
  // Build user list from credits table
  const userMap = new Map();
  if (allCredits) {
    for (const c of allCredits) {
      // Get email from auth metadata via admin API isn't available client-side
      // Store by user_id, we'll show partial emails
      const shortId = c.user_id.substring(0,8);
      userMap.set(c.user_id, { 
        user_id: c.user_id, 
        email: `user_${shortId}...`, 
        credits: c.credits || 0,
        created_at: c.created_at || new Date().toISOString()
      });
    }
  }
  
  allUsers = [...userMap.values()].sort((a,b) => b.credits - a.credits);
  
  // Stats
  document.getElementById('statUsers').textContent = allUsers.length;
  document.getElementById('statTotalCredits').textContent = allUsers.reduce((s,u) => s+u.credits, 0);
  
  const today = new Date().toISOString().split('T')[0];
  const todayLogs = logs?.filter(l => l.created_at?.startsWith(today) && 
    (l.action?.includes('AI辅导') || l.action?.includes('辅导'))) || [];
  document.getElementById('statTodayUsed').textContent = todayLogs.length;
  
  renderUsers();
}

document.addEventListener('DOMContentLoaded', () => {
  if (!supabase) {
    document.getElementById('loginSection').innerHTML = '<div class="card login-card"><h2>⚙️ 需要配置</h2><p style="color:#8b949e">请先配置 Supabase</p></div>';
    return;
  }
  supabase.auth.onAuthStateChange((event, session) => {
    if (session) loadAdmin();
    else {
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('adminSection').classList.add('hidden');
    }
  });
  loadAdmin();
});
</script>
</body>
</html>
