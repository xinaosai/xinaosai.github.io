<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 信奥赛C++</title>
<script src="assets/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
nav{background:#161b22;padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30363d}
nav h2{color:#f0f6fc;font-size:1rem}
nav a{color:#58a6ff;text-decoration:none;font-size:.85rem}
.wrap{max-width:800px;margin:0 auto;padding:24px 16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;margin-bottom:16px}
h3{color:#f0f6fc;margin-bottom:12px}
input,button{font-family:inherit}
.fg{margin-bottom:12px}
.fg input{width:100%;padding:12px;background:#0d1117;border:2px solid #30363d;color:#c9d1d9;border-radius:8px;font-size:1rem}
.fg input:focus{outline:none;border-color:#58a6ff}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer}
.btn-grn{background:#238636;color:#fff}
.btn-grn:hover{background:#2ea043}
.btn-red{background:#da3633;color:#fff}
.btn-sm{padding:6px 14px;font-size:.8rem;width:auto;display:inline;border:none;border-radius:6px;font-weight:600;cursor:pointer}
.search{width:100%;padding:10px 14px;background:#0d1117;border:2px solid #30363d;color:#c9d1d9;border-radius:8px;margin-bottom:16px;font-size:.95rem}
.search:focus{outline:none;border-color:#58a6ff}
.user-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #30363d;gap:12px;flex-wrap:wrap}
.user-info{min-width:160px}
.user-email{font-weight:600;color:#f0f6fc;font-size:.9rem}
.user-credits{font-size:.8rem;color:#8b949e}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.actions input{width:56px;padding:6px 8px;background:#0d1117;border:2px solid #30363d;color:#c9d1d9;border-radius:6px;text-align:center;font-size:.85rem}
.actions input:focus{outline:none;border-color:#58a6ff}
.msg{padding:10px 16px;border-radius:8px;margin:10px 0;font-size:.85rem;display:none}
.msg.show{display:block}
.msg-err{background:rgba(218,54,51,.15);border:1px solid rgba(218,54,51,.3);color:#f85149}
.msg-ok{background:rgba(46,160,67,.15);border:1px solid rgba(46,160,67,.3);color:#3fb950}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:#0d1117;padding:16px;border-radius:8px;text-align:center}
.stat .num{font-size:1.6rem;font-weight:700;color:#58a6ff}
.stat .lbl{font-size:.75rem;color:#8b949e;margin-top:4px}
.hide{display:none!important}
</style>
</head>
<body>

<nav>
  <h2>⚙️ 管理后台</h2>
  <div style="display:flex;gap:12px;align-items:center">
    <span id="adminEmail" style="color:#8b949e;font-size:.85rem"></span>
    <a href="#" onclick="doLogout()" style="color:#f85149">退出</a>
  </div>
</nav>

<div class="wrap">

<div id="loginBox" class="hide">
  <div class="card" style="max-width:360px;margin:60px auto;text-align:center">
    <h3>🔐 管理员登录</h3>
    <div class="fg"><input type="email" id="lemail" placeholder="管理员邮箱"></div>
    <div class="fg"><input type="password" id="lpass" placeholder="密码"></div>
    <div class="msg msg-err" id="loginErr"></div>
    <button class="btn btn-grn" onclick="doLogin()">登录</button>
  </div>
</div>

<div id="adminBox" class="hide">
  <div class="card">
    <h3>📊 概览</h3>
    <div class="stats">
      <div class="stat"><div class="num" id="statUsers">-</div><div class="lbl">注册用户</div></div>
      <div class="stat"><div class="num" id="statCredits">-</div><div class="lbl">剩余总次数</div></div>
    </div>
  </div>

  <div class="card">
    <h3>👥 用户管理</h3>
    <input class="search" id="searchInput" placeholder="🔍 搜索用户..." oninput="renderUsers()">
    <div class="msg msg-err" id="opMsg"></div>
    <div class="msg msg-ok" id="okMsg"></div>
    <div id="userList"><p style="text-align:center;color:#8b949e;padding:20px">加载中...</p></div>
  </div>
</div>

</div>

<script>
var SUPABASE_URL = 'https://ikomfsvwkilqwlrlvvto.supabase.co';
var SUPABASE_KEY = 'sb_publishable_SbwyOuBjz6v1dePb8h2cFw_gHeFtnNn';
var ADMIN_EMAIL = 'zhaomingyu0605@gmail.com';
var sb;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) { console.error(e); }
var allUsers = [];

function $(id) { return document.getElementById(id); }
function hide(id) { $(id).classList.add('hide'); }
function show(id) { $(id).classList.remove('hide'); }
function msg(id, m) { var el = $(id); el.textContent = m; if (m) el.classList.add('show'); else el.classList.remove('show'); }

async function doLogin() {
  var e = $('lemail').value.trim(), p = $('lpass').value;
  if (!e || !p) return msg('loginErr', '请填写完整');
  var r = await sb.auth.signInWithPassword({ email: e, password: p });
  if (r.error) return msg('loginErr', r.error.message);
  if (r.data.user.email !== ADMIN_EMAIL) { await sb.auth.signOut(); return msg('loginErr', '非管理员账号'); }
  msg('loginErr', '');
  loadAdmin();
}

async function doLogout() { await sb.auth.signOut(); hide('adminBox'); show('loginBox'); }

async function loadAdmin() {
  var u = await sb.auth.getUser();
  if (!u.data.user || u.data.user.email !== ADMIN_EMAIL) { hide('adminBox'); show('loginBox'); return; }
  hide('loginBox'); show('adminBox');
  $('adminEmail').textContent = u.data.user.email;

  var cr = await sb.from('credits').select('*');
  allUsers = cr.data || [];
  $('statUsers').textContent = allUsers.length;
  $('statCredits').textContent = allUsers.reduce(function(s, u) { return s + (u.credits || 0); }, 0);
  renderUsers();
}

function renderUsers() {
  var q = $('searchInput').value.toLowerCase();
  var filtered = allUsers.filter(function(u) { return (u.email || u.user_id || '').toLowerCase().includes(q); });
  var list = $('userList');
  list.innerHTML = filtered.map(function(u) {
    var c = u.credits || 0;
    return '<div class="user-row">' +
      '<div class="user-info"><div class="user-email">' + u.user_id.substring(0, 12) + '...</div><div class="user-credits">剩余 <strong style="color:' + (c > 0 ? '#3fb950' : '#f85149') + '">' + c + '</strong> 次</div></div>' +
      '<div class="actions">' +
        '<button class="btn-sm btn-grn" onclick="addCredits(\'' + u.user_id + '\',1)">+1</button>' +
        '<button class="btn-sm btn-grn" onclick="addCredits(\'' + u.user_id + '\',6)">+6</button>' +
        '<button class="btn-sm btn-grn" onclick="addCredits(\'' + u.user_id + '\',20)">+20</button>' +
        '<input id="amt_' + u.user_id.replace(/[^a-zA-Z0-9]/g,'') + '" value="10" min="1" type="number">' +
        '<button class="btn-sm btn-grn" onclick="addCredits(\'' + u.user_id + '\',+document.getElementById(\'amt_' + u.user_id.replace(/[^a-zA-Z0-9]/g,'') + '\').value)">充</button>' +
        '<button class="btn-sm btn-red" onclick="resetCredits(\'' + u.user_id + '\')">清零</button>' +
      '</div></div>';
  }).join('');
}

async function addCredits(uid, amount) {
  if (amount <= 0) return;
  var cr = await sb.from('credits').select('credits').eq('user_id', uid).single();
  var curr = cr.data?.credits || 0;
  var nc = curr + amount;
  await sb.from('credits').upsert({ user_id: uid, credits: nc }, { onConflict: 'user_id' });
  await sb.from('credit_logs').insert({ user_id: uid, action: '💰 管理员充值', amount: amount, balance: nc });
  msg('okMsg', '已添加 ' + amount + ' 次'); setTimeout(function() { msg('okMsg', ''); }, 3000);
  loadAdmin();
}

async function resetCredits(uid) {
  if (!confirm('确定清零？')) return;
  var cr = await sb.from('credits').select('credits').eq('user_id', uid).single();
  var curr = cr.data?.credits || 0;
  await sb.from('credits').update({ credits: 0 }).eq('user_id', uid);
  await sb.from('credit_logs').insert({ user_id: uid, action: '🔄 额度清零', amount: -curr, balance: 0 });
  msg('okMsg', '已清零'); setTimeout(function() { msg('okMsg', ''); }, 3000);
  loadAdmin();
}

sb.auth.onAuthStateChange(function(event, session) { if (session) loadAdmin(); else { hide('adminBox'); show('loginBox'); } });
loadAdmin();
</script>
</body>
<!-- force rebuild v2 -->
</html>
