<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 1v1 辅导 - 信奥赛C++</title>
<script src="assets/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f7fa;color:#333;min-height:100vh}
nav{background:linear-gradient(135deg,#0f3460,#16213e);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between}
nav a{color:#fff;text-decoration:none;font-weight:700}
.nav-links{display:flex;gap:10px}
.nav-links a{color:rgba(255,255,255,.85);padding:6px 12px;border-radius:6px;font-size:.85rem}
.nav-links a.active{background:rgba(233,69,96,.3)}
.wrap{max-width:480px;margin:40px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:28px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h2{text-align:center;margin-bottom:4px}
.sub{text-align:center;color:#888;margin-bottom:20px;font-size:.9rem}
.tabs{display:flex;margin-bottom:20px;border-bottom:2px solid #e2e8f0}
.tab{flex:1;text-align:center;padding:10px;cursor:pointer;color:#888;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s}
.tab:hover{color:#e94560}
.tab.on{color:#e94560;border-bottom-color:#e94560}
.fg{margin-bottom:14px}
.fg label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px;color:#1a1a2e}
.fg input{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:1rem;background:#f8fafc}
.fg input:focus{outline:none;border-color:#58a6ff}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:.2s}
.btn-red{background:linear-gradient(135deg,#e94560,#c23152);color:#fff}
.btn-red:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(233,69,96,.35)}
.btn-green{background:linear-gradient(135deg,#2ea043,#238636);color:#fff}
.btn-green:hover{transform:translateY(-2px)}
.btn-gray{background:#e2e8f0;color:#666}
.btn-sm{display:inline;width:auto;padding:6px 16px;font-size:.85rem}
.hide{display:none!important}
.credit-num{font-size:3.5rem;font-weight:800;text-align:center;background:linear-gradient(135deg,#e94560,#0f3460);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.credit-label{text-align:center;color:#888;font-size:.9rem}
.qr{text-align:center}
.qr img{width:180px;border-radius:12px;margin:12px 0}
.plans{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.plan{padding:12px 18px;border:2px solid #e2e8f0;border-radius:10px;cursor:pointer;text-align:center;transition:.2s}
.plan:hover{border-color:#58a6ff}
.plan.sel{border-color:#e94560;background:rgba(233,69,96,.05)}
.plan .price{font-size:1.3rem;font-weight:700;color:#e94560}
.plan .desc{font-size:.8rem;color:#888}
.msg{padding:10px 16px;border-radius:8px;margin:10px 0;font-size:.9rem}
.msg-info{background:rgba(88,166,255,.1);border-left:3px solid #58a6ff}
.msg-err{background:rgba(233,69,96,.1);border-left:3px solid #e94560;color:#e94560}
.msg-ok{background:rgba(46,160,67,.1);border-left:3px solid #2ea043;color:#2ea043}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left}
</style>
</head>
<body>

<nav>
  <a href="index.html">🦐 信奥赛C++</a>
  <div class="nav-links">
    <a href="index.html">🏠</a>
    <a href="round1.html">📋</a>
    <a href="ai-tutor.html" class="active">🤖AI</a>
  </div>
</nav>

<div class="wrap" id="authBox">
  <div class="card">
    <h2>🤖 AI 1v1 辅导</h2>
    <p class="sub">随时随地，像有个信奥教练陪着你刷题</p>
    <div class="tabs">
      <div class="tab on" id="tabLogin" onclick="showLogin()">🔑 登录</div>
      <div class="tab" id="tabReg" onclick="showReg()">📝 注册</div>
    </div>
    <div id="loginForm">
      <div class="fg"><label>📧 邮箱</label><input type="email" id="lemail" placeholder="your@email.com"></div>
      <div class="fg"><label>🔒 密码</label><input type="password" id="lpass" placeholder="输入密码"></div>
      <div class="msg msg-err hide" id="loginErr"></div>
      <button class="btn btn-red" onclick="doLogin()">登录</button>
    </div>
    <div id="regForm" class="hide">
      <div class="fg"><label>📧 邮箱</label><input type="email" id="remail" placeholder="your@email.com"></div>
      <div class="fg"><label>🔒 密码（至少6位）</label><input type="password" id="rpass" placeholder="至少6位"></div>
      <div class="fg"><label>👤 昵称</label><input type="text" id="rname" placeholder="怎么称呼你？"></div>
      <div class="msg msg-err hide" id="regErr"></div>
      <button class="btn btn-red" onclick="doReg()">注册并开始</button>
    </div>
  </div>
  <div class="card" style="text-align:center;font-size:.9rem;color:#888">
    💡 <strong>新用户注册即送 1 次免费体验！</strong><br>之后赞赏获取更多：2元/次 | 10元/6次 | 30元/20次
  </div>
</div>

<div class="wrap hide" id="dashBox">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong id="welcomeText"></strong>
      <button class="btn btn-sm btn-gray" onclick="doLogout()">退出</button>
    </div>
  </div>
  <div class="card">
    <div class="credit-label">剩余辅导次数</div>
    <div class="credit-num" id="creditNum">0</div>
    <div class="credit-label">次</div>
    <div class="msg msg-err hide" id="tutorMsg"></div>
    <button class="btn btn-red" id="tutorBtn" onclick="startTutor()" style="margin-top:16px">🚀 开始 AI 辅导（消耗1次）</button>
    <p style="text-align:center;color:#888;font-size:.8rem;margin-top:8px">点击后引导联系AI教练进行1v1辅导</p>
  </div>
  <div class="card qr">
    <h3>💰 赞赏充值</h3>
    <div class="plans">
      <div class="plan sel" data-plan="1" onclick="pickPlan(1,this)"><div class="price">¥2</div><div class="desc">1次</div></div>
      <div class="plan" data-plan="6" onclick="pickPlan(6,this)"><div class="price">¥10</div><div class="desc">6次</div></div>
      <div class="plan" data-plan="20" onclick="pickPlan(20,this)"><div class="price">¥30</div><div class="desc">20次</div></div>
    </div>
    <img src="assets/qrcode.jpg" alt="赞赏码">
    <div class="msg msg-info">
      <strong>📌 充值流程：</strong>选档位→扫码赞赏→截图发管理员→额度到账
    </div>
  </div>
  <div class="card">
    <h3>📋 记录</h3>
    <table><thead><tr><th>时间</th><th>操作</th><th>变化</th><th>余额</th></tr></thead>
    <tbody id="historyBody"><tr><td colspan="4" style="text-align:center;color:#aaa">加载中...</td></tr></tbody></table>
  </div>
</div>

<script>
// ============ CONFIG ============
var SUPABASE_URL = 'https://ikomfsvwkilqwlrlvvto.supabase.co';
var SUPABASE_KEY = 'sb_publishable_SbwyOuBjz6v1dePb8h2cFw_gHeFtnNn';
var ADMIN_EMAIL = 'zhaomingyu0605@gmail.com';
var sb;
try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) { console.error('Supabase init error:', e); }
var selectedPlan = 1;

// ============ DOM HELPERS ============
function $(id) { return document.getElementById(id); }
function hide(id) { $(id).classList.add('hide'); }
function show(id) { $(id).classList.remove('hide'); }

// ============ TAB SWITCHING ============
function showLogin() { hide('regForm'); hide('regErr'); show('loginForm'); $('tabLogin').classList.add('on'); $('tabReg').classList.remove('on'); }
function showReg() { hide('loginForm'); hide('loginErr'); show('regForm'); $('tabReg').classList.add('on'); $('tabLogin').classList.remove('on'); }

// ============ PLAN PICKING ============
function pickPlan(n, el) { selectedPlan = n; document.querySelectorAll('.plan').forEach(p => p.classList.remove('sel')); el.classList.add('sel'); }

// ============ AUTH ============
async function doLogin() {
  var e = $('lemail').value.trim(), p = $('lpass').value;
  if (!e || !p) return showMsg('loginErr', '请填写邮箱和密码');
  var r = await sb.auth.signInWithPassword({ email: e, password: p });
  if (r.error) return showMsg('loginErr', r.error.message);
  showDash();
}

async function doReg() {
  var e = $('remail').value.trim(), p = $('rpass').value, n = $('rname').value.trim() || e.split('@')[0];
  if (!e || !p) return showMsg('regErr', '请填写邮箱和密码');
  if (p.length < 6) return showMsg('regErr', '密码至少6位');
  var r = await sb.auth.signUp({ email: e, password: p, options: { data: { nickname: n } } });
  if (r.error) return showMsg('regErr', r.error.message);
  if (r.data.user) {
    await sb.from('credits').insert({ user_id: r.data.user.id, credits: 1 });
    await sb.from('credit_logs').insert({ user_id: r.data.user.id, action: '🎁 注册赠送', amount: 1, balance: 1 });
  }
  showMsg('regErr', '');
  showDash();
}

function showMsg(id, msg) { var el = $(id); el.textContent = msg; if (msg) show(id); else hide(id); }

// ============ DASHBOARD ============
async function showDash() {
  var u = await sb.auth.getUser();
  if (!u.data.user) { hide('dashBox'); show('authBox'); return; }
  hide('authBox'); show('dashBox');
  var user = u.data.user;
  $('welcomeText').textContent = '👋 ' + (user.user_metadata?.nickname || user.email?.split('@')[0] || '同学') + '，你好！';

  var cr = await sb.from('credits').select('credits').eq('user_id', user.id).single();
  var credits = cr.data?.credits ?? 0;
  $('creditNum').textContent = credits;
  var btn = $('tutorBtn');
  if (credits <= 0) { btn.disabled = true; btn.textContent = '😢 次数不足，请先赞赏充值'; btn.className = 'btn btn-gray'; }
  else { btn.disabled = false; btn.textContent = '🚀 开始 AI 辅导（消耗1次）'; btn.className = 'btn btn-red'; }

  var logs = await sb.from('credit_logs').select('*').eq('user_id', user.id).order('created_at', { ascending: false }).limit(20);
  var tbody = $('historyBody');
  if (logs.data && logs.data.length > 0) {
    tbody.innerHTML = logs.data.map(function(l) {
      return '<tr><td>' + new Date(l.created_at).toLocaleString('zh-CN') + '</td><td>' + l.action + '</td><td style="color:' + (l.amount > 0 ? '#2ea043' : '#e94560') + '">' + (l.amount > 0 ? '+' : '') + l.amount + '</td><td>' + l.balance + '</td></tr>';
    }).join('');
  } else {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#aaa">暂无记录</td></tr>';
  }
}

// ============ TUTORING ============
async function startTutor() {
  var u = await sb.auth.getUser();
  if (!u.data.user) return;
  var cr = await sb.from('credits').select('credits').eq('user_id', u.data.user.id).single();
  if (!cr.data || cr.data.credits <= 0) { $('tutorMsg').textContent = '次数不足！请先赞赏充值'; show('tutorMsg'); return; }
  var nc = cr.data.credits - 1;
  await sb.from('credits').update({ credits: nc }).eq('user_id', u.data.user.id);
  await sb.from('credit_logs').insert({ user_id: u.data.user.id, action: '🤖 AI辅导', amount: -1, balance: nc });
  $('tutorMsg').textContent = ''; hide('tutorMsg');
  alert('🎉 已消耗1次辅导！\n\n请通过QQ群联系AI教练，备注你的邮箱：' + u.data.user.email + '\n\n管理员QQ：查看首页联系方式');
  showDash();
}

// ============ LOGOUT ============
async function doLogout() { await sb.auth.signOut(); hide('dashBox'); show('authBox'); }

// ============ INIT ============
sb.auth.onAuthStateChange(function(event, session) {
  if (session) showDash();
  else { hide('dashBox'); show('authBox'); }
});
showDash();
</script>

</body>
</html>
